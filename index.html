<!DOCTYPE html>
<html>
<head>
  <title>98AZX</title>
  <style>
    html, body {
      background: Canvas;
      color-scheme: light dark;
    }
  </style>
</head>

<body style="display:none">
<script>
  const params = new URLSearchParams(window.location.search);
  const game = params.get("l");

  if (game) {
    window.location.replace(`steam://rungameid/${game}`);
    setTimeout(() => {
      window.location.replace(`https://store.steampowered.com/app/${game}`);
    }, 2000);
  }
</script>
</body>
</html>
