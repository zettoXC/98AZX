<!DOCTYPE html>
<html>
<head>
  <title>98AZX</title>
  <style>
    html, body {
      background: Canvas;
      color-scheme: light dark;
    }
		body {
			margin: 0px;
			padding: 0px;
			height: 100vh;
			width: 100vw;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 5vh;
			color: white;
		}
  </style>
</head>

<body>
	<p id="center-txt"><p>
<script>
  const params = new URLSearchParams(window.location.search);
  const game = params.get("l");

  if (game) {
    window.location.replace(`steam://rungameid/${game}`);
    setTimeout(() => {
      window.location.replace(`https://store.steampowered.com/app/${game}`);
    }, 2000);
	} else {
		let txt = document.getElementById("center-txt");
		txt.append("exit now");
		console.log("no games");
	}
</script>
</body>
</html>
